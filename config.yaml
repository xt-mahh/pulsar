# =============================================================================
# Pulsar 主配置文件 (Phase 1)
# =============================================================================

# ========== 系统基础 ==========
system:
  name: "Pulsar"
  version: "0.1.0"
  data_dir: "./data"
  log_level: "INFO"

# ========== 运行时 ==========
runtime:
  heartbeat_interval: 15        # 心跳间隔(秒)
  max_restart_attempts: 3       # 最大重启次数
  restart_delay: 5              # 重启延迟(秒)
  drain_timeout: 30             # 优雅关闭超时(秒)

# ========== 网关 ==========
gateway:
  default_provider: "deepseek"
  fallback_provider: "local"
  timeout: 30
  max_retries: 3
  retry_delay: 2
  providers:
    deepseek:
      type: openai
      base_url: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"      # 环境变量
      model: "deepseek-chat"
      max_tokens: 4096
    local:
      type: openai
      base_url: "http://localhost:8080/v1"
      api_key: "not-needed"
      model: "qwen2.5-14b"

# ========== 平台适配器 ==========
adapters:
  wechat:
    enabled: true
    app_id: "${WECHAT_APP_ID}"
    app_secret: "${WECHAT_APP_SECRET}"
    token_cache_ttl: 7200           # Token 缓存时间(秒)
    api_base: "https://api.weixin.qq.com"
    rate_limit:
      max_calls_per_minute: 100
      max_calls_per_hour: 2000

# ========== 交互层 ==========
interaction:
  cli:
    enabled: true
    prompt_format: "rich"           # rich | plain | json
  mcp_server:
    enabled: true
    transport: "stdio"              # stdio | http
    host: "0.0.0.0"
    port: 8910

# ========== 任务管理 ==========
scheduler:
  enabled: true
  jobs:
    - name: "daily_publish"
      schedule: "0 17 * * *"
      task:
        type: "publish"
        platform: "wechat"

# ========== 审计 ==========
audit:
  enabled: true
  output: "file"                    # file | stdout
  path: "./data/logs/audit.log"
  log_levels: ["tool_call", "system_event", "auth"]