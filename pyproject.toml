[project]
name = "pulsar"
version = "0.1.0"
description = "Pulsar · 脉冲星 - 通用自媒体运营智能体"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "prompt-toolkit>=3.0",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "croniter>=2.0",
    "aiofiles>=23.0",
    "aiosqlite>=0.19",
    "jsonschema>=4.20",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "asgi-lifespan>=2.0",
    "mypy>=1.8",
    "ruff>=0.3",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
]

[project.scripts]
pulsar = "pulsar.interaction.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
