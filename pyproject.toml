[project]
name = "pulsar"
version = "0.1.0"
description = "Pulsar · 脉冲星 — 通用自媒体运营智能体"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "Pillow>=10.0.0",
    "python-crontab>=3.0.0",
]

[project.scripts]
pulsar = "interaction.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pulsar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"